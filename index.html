 <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAR-2A - Доступ до корабля</title>
    <style>
        body {
            background-color: black;
            color: green;
            font-family: 'Courier New', monospace;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            border: 2px solid green;
            padding: 20px;
            background-color: black;
            width: 90%;
            max-width: 600px;
            display: none;
        }
        .terminal-text {
            text-align: left;
            display: inline-block;
            font-size: 18px;
            white-space: pre-wrap;
        }
        .scan-btn {
            background: green;
            color: black;
            padding: 10px 20px;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: block;
            margin-top: 20px;
        }
        #username {
            background: black;
            border: 1px solid green;
            color: green;
            font-family: 'Courier New', monospace;
            padding: 5px;
            font-size: 18px;
        }
        .start-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: green;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            border: 2px solid green;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            .terminal-text {
                font-size: 16px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <audio id="backgroundAudio">
        <source src="https://github.com/kozatskyd/invite-site/raw/refs/heads/main/elektronnaya-vspyishka-apple-phone-postavlyaetsya-s-zvukovyim-effektom-zvukovogo-signala-41356.mp3" type="audio/mpeg">
    </audio>
    
    <button class="start-btn" onclick="startExperience()">РОЗПОЧАТИ</button>
    
    <div class="container" id="mainContent">
        <div class="terminal-text" id="text-output"></div>
        <input type="text" id="username" placeholder="Введіть своє ім'я">
        <button class="scan-btn" onclick="redirectToInvite()">Долучитися</button>
    </div>

    <script>
        function startExperience() {
            let audio = document.getElementById("backgroundAudio");
            let startBtn = document.querySelector(".start-btn");
            let mainContent = document.getElementById("mainContent");
            
            audio.play().then(() => {
                console.log("Звук запущено.");
            }).catch(error => {
                console.log("Помилка відтворення аудіо:", error);
            });
            
            startBtn.style.display = "none";
            mainContent.style.display = "block";
            typeText();
        }
        
        const text = "ВІТАЄМО, ПРЕДСТАВНИК ЕЛІТНОГО СУСПІЛЬСТВА 23-ГО СТОЛІТТЯ НА КОСМІЧНОМУ КОРАБЛІ ZAR-2A.\n\nЦЕЙ КОРАБЕЛЬ БУВ СТИЛІЗОВАНИЙ ПІД СТАРУ КВАРТИРУ 21 СТОЛІТТЯ.\n\nЦЕЙ КОРАБЕЛЬ БІЛЬШЕ НЕ ФУНКЦІОНУЄ, ОДНАК В МОРОЗИЛЬНИХ СИСТЕМАХ ЗАЛИШИЛИСЬ ЗАПАСИ СТАРОЇ, ВИШУКАНОЇ ЛЮДСЬКОЇ ЇЖІ, ЯКУ ВИ ЗМОЖЕТЕ СПРОБУВАТИ.\n\nЩОБ ДОЛУЧИТИСЬ ДО ВЕЧІРКИ ДО ДНЯ СВЯТОГО ВАЛЕНТИНА - ВВЕДІТЬ СВОЄ ІМ'Я:";
        let i = 0;
        function typeText() {
            if (i < text.length) {
                document.getElementById("text-output").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeText, 50);
            }
        }
        
        function redirectToInvite() {
            let name = document.getElementById('username').value.trim();
            if(name !== "") {
                window.location.href = `invite.html?name=${encodeURIComponent(name)}`;
            } else {
                alert("Введіть ім'я для доступу!");
            }
        }
    </script>
</body>
</html>
